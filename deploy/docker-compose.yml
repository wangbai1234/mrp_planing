services:
  mysql:
    image: mysql:8.0
    container_name: mrp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mrp
      MYSQL_USER: mrp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password --default-time-zone='+08:00'
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mrp-redis
    command: ["redis-server", "--requirepass", "${MRP_REDIS_PASSWORD:?Set MRP_REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${MRP_REDIS_PASSWORD:?Set MRP_REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: mrp-api
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MRP_DB_URL: jdbc:mysql://mysql:3306/mrp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      MRP_DB_USERNAME: mrp
      MRP_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MRP_REDIS_HOST: redis
      MRP_REDIS_PORT: 6379
      MRP_REDIS_PASSWORD: ${MRP_REDIS_PASSWORD:?Set MRP_REDIS_PASSWORD}
      MRP_JWT_SECRET: ${MRP_JWT_SECRET:?Set MRP_JWT_SECRET}
      MRP_SERVER_PORT: 8080
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload-data:/data/mrp/uploads

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: mrp-worker
    environment:
      SPRING_PROFILES_ACTIVE: prod,worker
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      MRP_DB_URL: jdbc:mysql://mysql:3306/mrp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      MRP_DB_USERNAME: mrp
      MRP_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MRP_REDIS_HOST: redis
      MRP_REDIS_PORT: 6379
      MRP_REDIS_PASSWORD: ${MRP_REDIS_PASSWORD:?Set MRP_REDIS_PASSWORD}
      MRP_JWT_SECRET: ${MRP_JWT_SECRET:?Set MRP_JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload-data:/data/mrp/uploads

volumes:
  mysql-data:
  redis-data:
  upload-data:
