spring:
  datasource:
    url: ${MRP_DB_URL}
    username: ${MRP_DB_USERNAME}
    password: ${MRP_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true

  data:
    redis:
      host: ${MRP_REDIS_HOST:localhost}
      port: ${MRP_REDIS_PORT:6379}

  batch:
    jdbc:
      initialize-schema: always

server:
  port: 0

mrp:
  jwt:
    secret: test-only-secret-key-must-be-at-least-256-bits-long-for-hmac
    expiration: 3600
  file:
    upload-dir: ./data/test-uploads

feishu:
  app-id: ${FEISHU_APP_ID:test-app-id}
  app-secret: ${FEISHU_APP_SECRET:test-app-secret}
  redirect-uri: ${FEISHU_REDIRECT_URI:http://localhost:5180/login/callback/}

logging:
  level:
    com.mrp: DEBUG
