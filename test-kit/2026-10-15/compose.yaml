name: mrp-testkit-20261015
services:
  mysql:
    image: mysql:8.0
    container_name: mrp-testkit-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${UAT_DB_PASSWORD:?Set UAT_DB_PASSWORD}
      MYSQL_DATABASE: mrp_testkit
      MYSQL_USER: mrp_testkit
      MYSQL_PASSWORD: ${UAT_DB_PASSWORD:?Set UAT_DB_PASSWORD}
    ports: ["127.0.0.1:3317:3306"]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [testkit_mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -uroot --silent']
      interval: 5s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7-alpine
    container_name: mrp-testkit-redis
    ports: ["127.0.0.1:6391:6379"]
    volumes: [testkit_redis:/data]
volumes:
  testkit_mysql:
  testkit_redis:
